# General
set -g prefix ^Space
set -ag terminal-features "screen-256color:RGB"
set -g renumber-windows on
set -g set-clipboard on
set -g mode-keys vi
set -g base-index 1
set -g display-time 0
set -g history-limit 50000

#Style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "bold"
set -g status-left-length 50
set -g status-left "#S"
set -g status-right ""

set -g mode-style "fg=#101010,bg=#DADADA"
set -g message-style "fg=#101010,bg=#DADADA"
set -g message-command-style "fg=#101010,bg=#DADADA"

set -g pane-border-style "fg=#DADADA,bg=default"
set -g pane-active-border-style "fg=#DADADA,bg=default"
set -g pane-border-lines heavy

set -g menu-style "fg=#DADADA,bg=#101010"
set -g menu-selected-style "fg=#101010,bg=#FAFAFA"
set -g menu-border-style "fg=#DADADA,bg=#101010"

set -g display-panes-colour "#DADADA"
set -g display-panes-active-colour "#FAFAFA"

set -g clock-mode-colour "#DADADA"

set -g popup-border-style "fg=#FAFAFA"
set -g popup-border-lines heavy 

# Binds
unbind ^B 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!#[fill=#DADADA]"

bind : command-prompt -p ":#[fill=#DADADA]" "%1"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind v copy-mode

unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind S set-window-option synchronize-panes \; \
  display-message "#{?pane_synchronized,Synchronize panes: ON,Synchronize panes: OFF}#[fill=#DADADA]"

bind x confirm-before -p 'Kill pane "#P"? (y/n)#[fill=#DADADA]' kill-pane
bind X confirm-before -p 'Kill window "#W"? (y/n)#[fill=#DADADA]' kill-window

bind t confirm-before -p "Kill current session (#S) and switch to the last? (y/n)#[fill=#DADADA]" "run-shell '~/.config/tmux/scripts/kill-current-session.sh #S'"
bind T confirm-before -p "Kill all other sessions? (y/n)#[fill=#FFFFFFF]" "run-shell '~/.config/tmux/scripts/kill-all-sessions.sh #S'"

bind f display-popup -w 30% -h 20% -E "~/.config/tmux/scripts/manage-sessions.sh"

bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "lazygit"

source = kokou-no-hito.conf

# Monitors
monitor = DP-2, highres@highrr, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, auto-left, 1, transform, 1

# Autostarts
exec-once = xrandr --output DP-2 --primary
exec-once = playerctld daemon
exec-once = wl-paste --watch cliphist store
exec-once = openrgb -p fans.orp
# exec-once = dunst 
exec-once = qs -p ~/.config/quickshell/ashell/shell.qml
exec-once = waybar
exec-once = hyprpaper
exec-once = hyprsunset

exec-once = [workspace 1 silent] ghostty --command=$HOME/dotfiles/.config/tmux/scripts/create-startup-session.sh
exec-once = [workspace 2 silent] zen-browser
exec-once = [workspace 3 silent] obsidian

# Environment variables
env = HYPRCURSOR_THEME, Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = WLR_NO_HARDWARE_CURSORS,1

cursor {
    no_hardware_cursors = true
    default_monitor = DP-2
}

# Look and feel
general {
    gaps_in = 10
    gaps_out = 20

    border_size = 1

    col.active_border = $border-color-active
    col.inactive_border = $border-color-inactive

    resize_on_border = false

    allow_tearing = false 

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1
    inactive_opacity = 1
    
    blur {
        enabled = false 
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    shadow {
        enabled = true 
        color = $shadow-color-active
        color_inactive = $shadow-color-inactive
        range = 5
    }
}

animations {
    enabled = false

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    accel_profile = flat
    force_no_accel = 1
    follow_mouse = 1

    sensitivity = 0
}

render {
	ctm_animation = 1
}

# Keybindings
$mainMod = SUPER

bind = $mainMod, Q, exec, ghostty --command=/home/ash1ra/dotfiles/.config/tmux/scripts/create-startup-session.sh
bind = $mainMod, SPACE, exec, tofi-drun | xargs hyprctl dispatch exec -- 
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region
bind = $mainMod, PRINT, exec, grim -o DP-2 - | wl-copy
bind = $mainMod, V, exec, cliphist list | tofi | cliphist decode | wl-copy
bind = $mainMod, P, exec, hyprpicker -a -f hex
bind = $mainMod, B, exec, killall quickshell; qs -p ~/.config/quickshell/ashell/shell.qml

bind = $mainMod, Z, exec, $HOME/dotfiles/.config/hypr/scripts/toggle_gaps.sh

bind = $mainMod, C, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating

bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, down, resizeactive, 0 50
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, right, resizeactive, 50 0

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# bind = $mainMod, Tab, workspace, +2
# bind = $mainMod&SHIFT, Tab, workspace, -2
#
# bind = $mainMod, mouse_down, workspace, +2
# bind = $mainMod, mouse_up, workspace, -2

bind = $mainMod, Tab, workspace, +1
bind = $mainMod&SHIFT, Tab, workspace, -1

bind = $mainMod, mouse_down, workspace, +1
bind = $mainMod, mouse_up, workspace, -1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = $mainMod, equal, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

